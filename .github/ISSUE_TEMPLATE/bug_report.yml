name: Bug Report
description: Report a bug in CloudLab Platform
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "## Bug Report"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend API
        - Frontend
        - Lab Engine (Containerlab)
        - KubeVirt / QEMU
        - Auth (Keycloak)
        - Billing (Stripe)
        - Browser Terminal (Wetty)
        - Infrastructure / K8s
        - CI/CD
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: shell
