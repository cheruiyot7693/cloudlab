name: Feature Request
description: Suggest a new feature or topology
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "## Feature Request"

  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: What pain point does this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Lab Catalog (new topology)
        - Backend API
        - Frontend UX
        - Billing
        - Team Workspaces
        - NOS Support
        - Infrastructure
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority (your assessment)
      options:
        - P0 — Blocker / MVP critical
        - P1 — Important, needed for GA
        - P2 — Nice to have
