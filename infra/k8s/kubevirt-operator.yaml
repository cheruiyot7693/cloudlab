# CloudLab Platform — KubeVirt Operator
# =======================================
# KubeVirt enables running QEMU/KVM virtual machines inside Kubernetes.
# Required for NOS images that cannot run as containers:
#   - Cisco IOSv / IOS-XE
#   - Juniper vMX / vSRX (full)
#   - Nokia SR OS
#
# NOTE: KubeVirt requires hardware virtualisation (VT-x/AMD-V).
# On your local Kali machine, check first:
#   egrep -c '(vmx|svm)' /proc/cpuinfo   # must be > 0
#
# If running in a VM (nested virt), KubeVirt will fall back to software
# emulation (much slower — only use for testing, not production labs).
#
# Apply:
#   kubectl apply -f infra/k8s/kubevirt-operator.yaml
#
# Verify:
#   kubectl get pods -n kubevirt
#   kubectl get kubevirt -n kubevirt
# =======================================

---
# ── KubeVirt Namespace ────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt
  labels:
    app.kubernetes.io/part-of: cloudlab
    cloudlab/namespace-type: kubevirt

---
# ── KubeVirt Operator ─────────────────────────────────────────────────────────
# Installs the KubeVirt operator which then installs all KubeVirt components.
# Using v1.2.0 — stable release compatible with K3s v1.29.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: virt-operator
  namespace: kubevirt
  labels:
    app: virt-operator
    kubevirt.io: virt-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      kubevirt.io: virt-operator
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: virt-operator
        kubevirt.io: virt-operator
        name: virt-operator
        prometheus.kubevirt.io: "true"
    spec:
      priorityClassName: kubevirt-cluster-critical
      serviceAccountName: kubevirt-operator
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
        - key: node-role.kubernetes.io/master
          operator: Exists
      containers:
        - name: virt-operator
          image: quay.io/kubevirt/virt-operator:v1.2.0
          imagePullPolicy: IfNotPresent
          command:
            - virt-operator
          args:
            - --port=8443
            - -v=2
          ports:
            - containerPort: 8443
              name: metrics
              protocol: TCP
            - containerPort: 8444
              name: webhooks
              protocol: TCP
          env:
            - name: OPERATOR_IMAGE
              value: quay.io/kubevirt/virt-operator:v1.2.0
            - name: WATCH_NAMESPACE
              value: ""
            - name: KUBEVIRT_VERSION
              value: v1.2.0
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 150Mi
            limits:
              cpu: 500m
              memory: 400Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            timeoutSeconds: 10

---
# ── KubeVirt CR — tells operator what to install ──────────────────────────────
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  # Use software emulation if hardware virt not available (local dev fallback)
  configuration:
    developerConfiguration:
      useEmulation: true     # set to false on bare metal with VT-x

  # Resource tuning for 8GB RAM — minimal footprint
  infra:
    replicas: 1
    nodePlacement:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists

  workloads:
    nodePlacement:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
