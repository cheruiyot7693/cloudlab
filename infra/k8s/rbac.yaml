# CloudLab Platform — RBAC
# Applied by bootstrap-k3s.sh and also usable standalone:
#   kubectl apply -f infra/k8s/rbac.yaml

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudlab-backend
  namespace: cloudlab-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudlab-lab-manager
rules:
  # Core resources for lab provisioning
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - pods/log
      - pods/exec
      - services
      - configmaps
      - persistentvolumeclaims
      - secrets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Apps
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Network policies (lab isolation)
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Containerlab CRD (Phase 0.4)
  - apiGroups: ["clabs.nokia.com"]
    resources: ["containerlabs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # KubeVirt CRD (Phase 0.4)
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Resource quotas (for per-user lab limits)
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudlab-backend-lab-manager
subjects:
  - kind: ServiceAccount
    name: cloudlab-backend
    namespace: cloudlab-system
roleRef:
  kind: ClusterRole
  name: cloudlab-lab-manager
  apiGroup: rbac.authorization.k8s.io

---
# Read-only role for monitoring/audit
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudlab-monitor-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "namespaces", "resourcequotas"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudlab-monitor
  namespace: cloudlab-monitor

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudlab-monitor-reader
subjects:
  - kind: ServiceAccount
    name: cloudlab-monitor
    namespace: cloudlab-monitor
roleRef:
  kind: ClusterRole
  name: cloudlab-monitor-reader
  apiGroup: rbac.authorization.k8s.io
