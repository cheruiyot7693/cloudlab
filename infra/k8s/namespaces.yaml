# CloudLab Platform — Namespace Definitions
# Applied by bootstrap-k3s.sh and also usable standalone:
#   kubectl apply -f infra/k8s/namespaces.yaml

---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudlab-system
  labels:
    app.kubernetes.io/part-of: cloudlab
    app.kubernetes.io/component: platform

---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudlab-labs
  labels:
    app.kubernetes.io/part-of: cloudlab
    app.kubernetes.io/component: labs

---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudlab-monitor
  labels:
    app.kubernetes.io/part-of: cloudlab
    app.kubernetes.io/component: observability
