# =============================================================================
# CloudLab — Longhorn PVC Smoke Test
# Applied by install-longhorn.sh, deleted after verification
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-smoke-pvc
  namespace: default
  labels:
    app.kubernetes.io/part-of: cloudlab
    cloudlab/purpose: smoke-test
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi

---
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-smoke-test
  namespace: default
  labels:
    app.kubernetes.io/part-of: cloudlab
    cloudlab/purpose: smoke-test
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["sleep", "300"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: longhorn-smoke-pvc
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
